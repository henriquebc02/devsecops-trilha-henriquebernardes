name: SAST - Semgrep

on: 
  push:
  pull_request:

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      # SemGrep: análise estática de código
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        working-directory: app
        run: npm ci

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Rodar Semgrep
        run: semgrep scan --config auto --error app/

      # Trivy: análise das dependências
      - name: Trivy - SCA
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: ./app
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

      # Construção da imagem Docker
      - name: Construir imagem Docker
        run: docker build -t saci-api:latest ./app

      # Trivy: análise da imagem Docker
      - name: Trivy - Imagem Docker
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: saci-api:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

      # Gitleaks: detecção de segredos
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy no Render
  deploy:
    needs: sast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Acionar deploy no Render
        env:
          DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_URL"
          curl --fail --show-error --silent \
            --request POST "$DEPLOY_URL"
