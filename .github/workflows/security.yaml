name: Pipeline DevSecOps

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Gate 1: SAST
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        working-directory: app
        run: npm ci

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Rodar Semgrep
        run: semgrep scan --config auto --error app/

  # Gate 2: SCA (dependências + Dockerfile)
  sca:
    name: SCA - Trivy (dependências e Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Trivy - scan de dependências (SCA)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: app/
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy - scan do Dockerfile (misconfig)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: app/
          severity: CRITICAL
          exit-code: '1'

  # Gate 3: Detecção de segredos
  secrets:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necessário para varrer todo o histórico

      - name: Rodar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gate 4: Scan da imagem Docker
  image-scan:
    name: Container - Trivy (imagem Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t app:${{ github.sha }} app/

      - name: Trivy - scan da imagem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: app:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'